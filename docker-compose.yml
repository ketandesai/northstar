services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
