services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-northstar}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:16-alpine
    container_name: northstar-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-northstar}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    container_name: northstar-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        for f in /migrations/*.sql; do
          echo "Applying migration: $$f"
          psql -v ON_ERROR_STOP=1 \
            -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-northstar} \
            -f "$$f" \
            || exit 1
        done
        echo "All migrations applied."

volumes:
  postgres_data:
    driver: local
